[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-receipts"
version = "0.1.0"
description = "Congress money tracker: FEC data to a static site"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "pandas>=2.0", "duckdb>=1.1"]

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.15"]

[tool.setuptools.packages.find]
include = ["receipts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter owns line length; long strings stay readable

[tool.ruff.format]
quote-style = "single"
