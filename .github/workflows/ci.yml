# The Receipts — CI: rebuild from the PINNED FEC snapshot and verify
# byte-identical output.
#
# What this does:
#   1. Stages the pinned bulk snapshot with ./fetch_snapshot.sh — the
#      `fec-bulk-<date>` GitHub Release named by `_snapshot` in
#      data/source/baseline.json (~315 MB, every file sha256-verified).
#      NOT a live FEC download: the FEC updates its bulk files in place,
#      so live inputs differ day to day and can never reproduce a
#      committed dataset (that is why every run from Nov 13 to Nov 22,
#      2026 failed). New data arrives only through a reviewed rebaseline
#      (src/common/baseline.py).
#   2. Runs the full pipeline: python3 src/rebuild.py. Every step checks
#      its figures against data/source/baseline.json; verify_dataset.py
#      runs the standing audits as the last step.
#   3. FAILS if the rebuild does not reproduce the committed dataset
#      byte-identically (git diff --exit-code on the two dataset files).
#      A mismatch means the code, the data, or the method is wrong —
#      never adjust a figure to match (AGENTS.md §5).
#   4. Rebuilds the static site (docs/index.html), FAILS if the committed
#      page differs from the rebuilt one apart from its timestamp (the
#      public page must be the committed dataset's page), and runs the
#      site verifier.
#
# What this does NOT do: deploy. GitHub Pages serves docs/ on master
# automatically, so there is no deploy step here or anywhere else.
# This workflow needs no secrets (the snapshot is a public Release and
# the rebuild uses the committed fec_lookup_results.json), so it is safe
# to run on pull requests, including PRs from forks.
#
# Concurrency: runs queue behind each other (cancel-in-progress: false)
# so a push during a run never kills a verification in flight.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild-and-verify:
    name: Rebuild and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30  # snapshot download (~315 MB) + rebuild (~1 min
      # measured locally, Nov 22, 2026) + site build/verify.

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Stage the pinned FEC snapshot
        # Downloads the Release the baseline was recorded from, verifies
        # every sha256, extracts, writes data/raw/SNAPSHOT.
        run: ./fetch_snapshot.sh

      - name: Rebuild dataset
        run: python3 src/rebuild.py

      - name: Show rebuilt dataset checksums
        # Informational only — the gate below is the byte comparison.
        run: md5sum congress-money-tracker.csv congress-money-tracker.json

      - name: Fail if rebuild differs from committed dataset
        # rebuild.py does NOT compare against the committed dataset, so
        # CI enforces byte-identical reproduction here. Any diff = FAIL.
        run: |
          if ! git diff --exit-code -- congress-money-tracker.csv congress-money-tracker.json; then
            echo "::error::Rebuild did not reproduce the committed dataset byte-identically. See AGENTS.md §5: stop and report, never adjust a figure to match."
            exit 1
          fi

      - name: Build static site
        run: python3 src/site/build_site.py

      - name: Fail if the committed page is not the rebuilt page
        # Same timestamp pattern verify_site.py's determinism check strips.
        run: |
          if ! git diff --exit-code -I'Generated [0-9-]+ [0-9:]+ UTC' -- docs/index.html > /dev/null; then
            echo "::error::docs/index.html differs from the page built from the committed dataset. Rebuild it (python3 src/site/build_site.py) and commit — never hand-edit it."
            exit 1
          fi

      - name: Verify static site
        # Needs node (preinstalled on ubuntu-latest): node --check on the
        # page scripts plus the runtime smoke test. Also re-runs the
        # generator and checks determinism apart from the timestamp.
        run: python3 src/site/verify_site.py
