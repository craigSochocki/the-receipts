# Rebuilds the dataset from the pinned FEC snapshot and fails unless it
# reproduces the committed dataset and site byte-identically.
# No deploy step: GitHub Pages serves docs/ on master. Needs no secrets.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:  # the FEC refresh starts CI on its own branch this way

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild-and-verify:
    name: Rebuild and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium for the site smoke test
        run: python3 -m playwright install --with-deps chromium

      - name: Lint and format
        run: |
          ruff check receipts tests
          ruff format --check receipts tests

      - name: Type check
        run: mypy

      - name: JS unit tests
        # Node's built-in runner, no dependencies: loads the shipped site
        # scripts in a vm context and tests the rule mirrors directly.
        # Node is preinstalled on the runner.
        run: node --test "receipts/site/tests/*.test.mjs"

      - name: Stage the pinned FEC snapshot
        # Before the tests: the square-one tests read the raw bulk files
        # from data/raw/, which only exist once the snapshot is staged.
        run: ./fetch_snapshot.sh

      - name: Unit tests, complexity limits and coverage floor
        # -n 4 spreads the suite across the runner's cores; pytest-cov
        # merges the workers' coverage, so the floor check is unchanged.
        run: python3 -m pytest -q -n 4 --cov=receipts tests

      - name: Rebuild dataset
        run: python3 receipts/rebuild.py

      - name: Show rebuilt dataset checksums
        run: md5sum congress-money-tracker.csv congress-money-tracker.json congress-money-tracker-cycles.csv

      - name: Fail if rebuild differs from committed dataset
        # rebuild.py does NOT compare against the committed dataset, so
        # CI enforces byte-identical reproduction here. Any diff = FAIL.
        run: |
          if ! git diff --exit-code -- congress-money-tracker.csv congress-money-tracker.json congress-money-tracker-cycles.csv; then
            echo "::error::Rebuild did not reproduce the committed dataset byte-identically. See AGENTS.md §5: stop and report, never adjust a figure to match."
            exit 1
          fi

      - name: Build static site
        run: python3 receipts/site/build_site.py

      - name: Fail if the committed pages are not the rebuilt pages
        run: |
          if ! git diff --exit-code -I'Generated [0-9-]+ [0-9:]+ UTC' -- docs/index.html docs/explore/index.html docs/methodology/index.html > /dev/null; then
            echo "::error::A committed page differs from the page built from the committed dataset. Rebuild it (python3 receipts/site/build_site.py) and commit — never hand-edit it."
            exit 1
          fi

      - name: Verify static site
        # node --check on the page scripts (node is preinstalled), the
        # smoke test in Chromium (installed above). Also re-runs the
        # generator and checks determinism apart from the timestamp.
        run: python3 receipts/site/verify_site.py
