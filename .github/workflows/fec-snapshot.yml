# The Receipts — FEC bulk snapshot: download once, pin it as a GitHub Release.
#
# WHY: the FEC updates its 2026 bulk files IN PLACE under the same URLs
# (weball26.zip etc.), with no version in the URL. So "rebuild from FEC
# bulk" means different inputs on different days, and the byte-identical
# gate (AGENTS.md §5) cannot hold against live downloads. The Nov 12, 2026
# inputs behind the committed dataset were never saved and are gone —
# by Nov 15 the 2026 totals had already moved. This workflow saves the
# exact inputs so a rebuild can be pinned to them.
#
# WHAT IT PUBLISHES: one Release per run, tag fec-bulk-<YYYY-MM-DD>, with
#   - fec-bulk-<date>.tar  — the downloaded files exactly as the FEC served
#     them (weball/cm/pas2 zips 1980-2026 + IE CSVs 2022/2024/2026), in the
#     data/raw/ layout download_bulk.sh uses. ~350 MB.
#   - SHA256SUMS           — sha256 of every file inside the tar.
#   - PROVENANCE.tsv       — source URL, HTTP Last-Modified, bytes, sha256.
# The Release is public (public repo). Contents are public FEC data;
# Craig approved publishing these snapshots Nov 22, 2026.
#
# WHAT IT DOES NOT DO: rebuild, verify, or change the dataset. A snapshot
# becomes the dataset's input only through ./fetch_snapshot.sh <tag> +
# `python3 src/rebuild.py --rebaseline` + a reviewed PR (README,
# "Pinned snapshots and the baseline").
#
# Trigger: manual (workflow_dispatch). The first snapshot,
# fec-bulk-2026-11-22, was made from the claude/fec-snapshot branch.

name: FEC snapshot

on:
  workflow_dispatch:

permissions:
  contents: write  # create the Release

concurrency:
  group: fec-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Snapshot FEC bulk
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Download FEC bulk
        # Same script CI uses, so the snapshot is exactly CI's input set.
        run: ./download_bulk.sh

      - name: Record provenance
        run: |
          set -euo pipefail
          BASE="https://www.fec.gov/files/bulk-downloads"
          cd data/raw
          # Only the downloaded originals (zips + IE CSVs), not the
          # extracted copies — extraction is reproducible from these.
          find weball cm pas2 -maxdepth 1 -name '*.zip' > ../../files.txt
          find ie -name 'independent_expenditure_*.csv' >> ../../files.txt
          sort -o ../../files.txt ../../files.txt
          printf 'path\turl\tlast_modified\tbytes\tsha256\n' > ../../PROVENANCE.tsv
          while read -r f; do
            name=$(basename "$f")
            case "$name" in
              independent_expenditure_*) cy=${name#independent_expenditure_}; cy=${cy%.csv} ;;
              *) yy=$(echo "$name" | grep -oE '[0-9]{2}\.zip$' | cut -c1-2)
                 if [ "$yy" -ge 80 ]; then cy=19$yy; else cy=20$yy; fi ;;
            esac
            url="$BASE/$cy/$name"
            lm=$(curl -sIL --retry 3 "$url" | grep -i '^last-modified:' | tail -1 | cut -d' ' -f2- | tr -d '\r' || true)
            printf '%s\t%s\t%s\t%s\t%s\n' "$f" "$url" "${lm:-unknown}" \
              "$(stat -c %s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)" >> ../../PROVENANCE.tsv
          done < ../../files.txt
          xargs sha256sum < ../../files.txt > ../../SHA256SUMS
          wc -l < ../../files.txt

      - name: Package
        run: |
          set -euo pipefail
          echo "SNAP_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
          tar -C data/raw -cf "fec-bulk-$(date -u +%F).tar" -T files.txt
          ls -l fec-bulk-*.tar

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="fec-bulk-$SNAP_DATE"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists — snapshots are immutable; not overwriting."
            exit 1
          fi
          {
            echo "FEC bulk inputs as downloaded $SNAP_DATE (UTC) by ./download_bulk.sh."
            echo
            echo "Pinned input for rebuilds — see .github/workflows/fec-snapshot.yml."
            echo "Verify: \`tar -xf fec-bulk-$SNAP_DATE.tar -C data/raw && (cd data/raw && sha256sum -c ../../SHA256SUMS)\`"
          } > notes.md
          gh release create "$tag" \
            "fec-bulk-$SNAP_DATE.tar" SHA256SUMS PROVENANCE.tsv \
            --title "FEC bulk snapshot $SNAP_DATE" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest=false
