# The Receipts — single source of truth for values shared across pipeline scripts.
#
# Rules:
# - Every script loads this file through work/config.py (load_config()).
# - All paths are relative to the repo root (the directory containing this file).
# - Scripts resolve paths from the repo root, never from an absolute path and
#   never from the current working directory.
# - Do not re-hardcode any value from this file in a script. If a new script
#   needs a shared value, add it here first.

committees:
  # FEC committee IDs, verified by direct FEC API lookup (see methodology.md).
  aipac_pac: "C00797670"  # AIPAC PAC
  udp: "C00799031"        # United Democracy Project (AIPAC-affiliated super PAC)

cycles:
  career_start: 1980       # first FEC cycle in the career money pull
  career_end: 2026         # last FEC cycle in the career money pull
  udp: [2022, 2024, 2026]  # cycles with UDP independent-expenditure data (UDP first filed Jan 2022)
  current: 2026            # current / most recent cycle, used for diagnostics and FEC lookups

paths:
  work: work
  bulk: work/bulk
  ie: work/bulk/ie
  roster: work/roster.json
  roster_intermediate: work/roster_intermediate.json
  fec_lookup_results: work/fec_lookup_results.json
  manual_roster_notes: work/manual_roster_notes.json
  money_per_cycle: work/money_per_cycle.json
  money_pas2_weball: work/money_pas2_weball.csv
  money_udp: work/money_udp.csv
  money_udp_per_cycle: work/money_udp_per_cycle.json
  dedup_applied: work/dedup-applied.json
  dedup_notes: work/dedup-notes.json
  primary_targets: work/primary-targets.md
  opposition_computed: work/opposition-computed.json
  dataset_csv: congress-money-tracker.csv
  dataset_json: congress-money-tracker.json

# As-of date carried on every dataset row (data_as_of). Update when the
# pulls are re-run on newer filings.
data_as_of: "2026-11-12"

fec_api:
  base_url: "https://api.open.fec.gov/v1/candidates/"
  api_key_env: "FEC_API_KEY"       # set to a real key for production use
  api_key_default: "DEMO_KEY"      # demo key: rate-limited, lookup only
  request_timeout_seconds: 30
  sleep_between_requests_seconds: 0.4

party_codes:
  # Roster party label -> FEC API party code (used by fec_lookup.py).
  Democrat: DEM
  Republican: REP
  Independent: IND
  PPD: DEM

verification:
  # Prior UDP pull's deduped S+O totals per cycle, used to reconcile the
  # opposition-credit computation against the original UDP support pull.
  udp_prior_cycle_totals:
    2022: 26107515.77
    2024: 38044932.69
    2026: 54322881.51
  # Uncredited races are only listed in the opposition report when the
  # opposing spend reaches this threshold (dollars).
  opposition_uncredited_report_threshold: 100000
  # Roster-wide career totals from methodology.md §6, as of Nov 12, 2026.
  # verify_dataset.py checks the rebuilt dataset against these to the cent.
  # (Armstrong's "unknown" money is excluded from every sum.)
  methodology_totals:
    individual_contribution_total_career: 8763847353.73
    aipac_pac_direct_career: 7567773.00
    aipac_earmark_transmitted_career: 191573.00
    corporate_pac_career: 972228584.00
    corporate_earmark_transmitted_career: 26850.00
    udp_ie_support_career: 42415003.76
    udp_ie_opposing_opponents_career: 28281982.23
    udp_ie_total_benefit_career: 70696985.99
  # Clean-in-2026 expectations from methodology.md §14, as of Nov 12, 2026.
  # clean_2026 counts are over the whole roster; the 67 / 53 figures are
  # the incoming (120th) House subset.
  clean_2026:
    true_total: 84
    false_total: 579
    null_total: 1
    house_120th_verified_clean: 67
    house_120th_verified_clean_democrat: 63
    house_120th_verified_clean_republican: 4
    house_120th_career_clean: 53
    house_120th_career_clean_democrat: 50
    house_120th_career_clean_republican: 3
    house_120th_clean_2026_not_career_clean: 14

# The dataset's column order (CSV) and key order (JSON). The two differ
# only in the 2026 trio: the CSV lists individual_2026 first, the JSON
# lists corp_2026 first — both orders are the committed ones, preserved
# exactly so a rebuild is byte-identical. Every script that writes the
# dataset filters these lists to the columns it produces.
