  dataset_json: congress-money-tracker.json
  dataset_csv: congress-money-tracker.csv
  roster: data/intermediate/roster.json
  roster_intermediate: data/intermediate/roster_intermediate.json
  fec_lookup_results: data/source/fec_lookup_results.json
  manual_roster_notes: data/source/manual_roster_notes.json
  money_per_cycle: data/intermediate/money_per_cycle.json
  money_pas2_weball: data/intermediate/money_pas2_weball.csv
  money_udp: data/intermediate/money_udp.csv
  money_udp_per_cycle: data/intermediate/money_udp_per_cycle.json
  self_funding_per_cycle: data/intermediate/self_funding_per_cycle.json
  self_funding_csv: data/intermediate/self_funding.csv
