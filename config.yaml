# The Receipts — single source of truth for values shared across pipeline scripts.
#
# Rules:
# - Every script reads this file through settings() (receipts/common/settings.py),
#   on first use, never at import. Its classes must match this file exactly:
#   a new key is added there too, or the run stops naming it.
# - All paths are relative to the repo root (the directory containing this file).
# - Scripts resolve paths from the repo root, never from an absolute path and
#   never from the current working directory.
# - Do not re-hardcode any value from this file in a script. If a new script
#   needs a shared value, add it here first.
# - Layout: code in receipts/ (common / ingest /
#   transform / validate), staged bulk in data/raw/ (gitignored),
#   committed inputs in data/source/, regenerable staging files in
#   data/intermediate/ (gitignored), local dataset backups in data/snapshots/ (gitignored),
#   one-off API evidence in data/evidence/, research notes in research/.
#   The dataset itself stays at the repo root. Long term, data moves out
#   of the repo into a database (see architecture.md); until then, every
#   path a script touches comes from this file, so the move is a config
#   change, not a code change.

committees:
  # FEC committee IDs, verified by direct FEC API lookup (see methodology.md).
  aipac_pac: "C00797670"  # AIPAC PAC
  udp: "C00799031"        # United Democracy Project (AIPAC-affiliated super PAC)
  winred: "C00694323"     # WinRed, a conduit filing as a hybrid PAC

cycles:
  career_start: 1980       # first FEC cycle in the career money pull
  career_end: 2026         # last FEC cycle in the career money pull
  udp: [2022, 2024, 2026]  # cycles with UDP independent-expenditure data (UDP first filed Jan 2022)
  current: 2026            # current / most recent cycle, used for diagnostics and FEC lookups

paths:
  raw: data/raw
  bulk: data/raw
  ie: data/raw/ie
  source: data/source
  intermediate: data/intermediate
  store: data/store/receipts.duckdb
  snapshots: data/snapshots
  evidence: data/evidence
  site: docs
  dataset_json: congress-money-tracker.json
  dataset_csv: congress-money-tracker.csv
  roster: data/intermediate/roster.json
  roster_intermediate: data/intermediate/roster_intermediate.json
  fec_lookup_results: data/source/fec_lookup_results.json
  baseline: data/source/baseline.json
  manual_roster_notes: data/source/manual_roster_notes.json
  other_committees_diagnostics: data/intermediate/other_committees_diagnostics.json
  all_ie_per_cycle: data/intermediate/all_ie_per_cycle.json
  freshness_snapshot: data/intermediate/freshness_snapshot.json
  dedup_applied: data/source/dedup-applied.json
  run_history: data/source/run_history.csv
  roster_facts: data/source/roster_facts.yaml
  primary_targets: data/intermediate/primary-targets.md
  opposition_computed: data/intermediate/opposition-computed.json

# Date of the pinned FEC snapshot the money came from; carried on every
# dataset row.
data_as_of: "2026-11-22"

fec_api:
  base_url: "https://api.open.fec.gov/v1/candidates/"
  api_key_env: "FEC_API_KEY"       # set to a real key for production use
  api_key_default: "DEMO_KEY"      # demo key: rate-limited, lookup only
  request_timeout_seconds: 30
  sleep_between_requests_seconds: 0.4
  # HTTP 429 retry (FecApi in receipts/common/fec_api.py, used by every
  # freshness API call and by pull_f6's docquery CSV fetch). A full
  # freshness --all run can make more calls than a standard api.data.gov
  # key allows per hour, so it may hit 429 part-way through. On a 429 the wait is the
  # Retry-After header when present, else exponential backoff
  # (backoff_base_seconds * 2**(attempt-1), capped at
  # backoff_cap_seconds). max_attempts bounds the retries; if a
  # projected wait would push the total waited for one request past
  # max_wait_seconds, the run fails loudly instead of sleeping it out.
  # Non-429 HTTP errors are NOT retried (immediate SystemExit).
  retry:
    max_attempts: 5                # total attempts per request (1 + 4 retries)
    backoff_base_seconds: 2.0      # first backoff wait; then 4s, 8s, 16s (capped)
    backoff_cap_seconds: 300.0     # longest single backoff wait (5 min)
    max_wait_seconds: 900.0        # longest total wait for one request (15 min)

freshness:
  # F24 committee sweeps (24/48-hour independent expenditures, cycle 2026
  # only): `pull_freshness.py --all` sweeps each committee below committee-wide (every
  # candidate it targeted, roster or not) and attributes rows to roster
  # people by candidate_id. The list is chosen by hand: the biggest
  # roster-targeted IE spenders of the cycle when it was set
  # (data/intermediate/all_ie_per_cycle.json ->
  # per_cycle_summaries.<cycle>.top_committees_roster_targeted), plus
  # UDP by design, as AIPAC-affiliated. No script reads the notes; the
  # figures behind the choice are in research/methodology-evidence.md.
  f24_committee_sweep_cycle: 2026
  f24_committee_sweep:
    - committee_id: "C00960435"
      committee_name: "NO GOING BACK PAC INC."
      note: "a top roster-targeted IE spender when the list was set"
    - committee_id: "C00865444"
      committee_name: "WinSenate"
      note: "a top roster-targeted IE spender when the list was set"
    - committee_id: "C00495028"
      committee_name: "HMP"
      note: "a top roster-targeted IE spender when the list was set"
    - committee_id: "C00960211"
      committee_name: "TEXAS PAC"
      note: "a top roster-targeted IE spender when the list was set"
    - committee_id: "C00836221"
      committee_name: "DEFEND AMERICAN JOBS"
      note: "a top roster-targeted IE spender when the list was set"
    - committee_id: "C00799031"
      committee_name: "UNITED DEMOCRACY PROJECT (UDP)"
      note: "included by design: AIPAC-affiliated"

party_codes:
  # Roster party label -> FEC API party code (used by fec_lookup.py).
  Democrat: DEM
  Republican: REP
  Independent: IND
  PPD: DEM

run_checks:
  # receipts/validate/run_history.py stops a run when its FEC inputs look wrong.
  max_row_drop: 0.01  # a file may lose at most this share of its rows since the last recorded snapshot
  max_file_age_days: 14  # the newest current-cycle file must be at most this old on the snapshot date
verification:
  # Policy values only. Figures that new FEC data can move live in
  # data/source/baseline.json (receipts/common/baseline.py).
  # Bulk coverage end dates, by column family (see methodology §15).
  # The freshness layer covers activity after these dates; the bulk
  # re-pull replaces it. Judged from the pinned snapshot at each
  # rebaseline, not computed; the evidence is in research/methodology-evidence.md §8.1.
  coverage_end:
    committee_money_pas2: "2026-10-14"   # corporate, AIPAC, other-committee
    weball: "2026-10-14"                 # individual, self-funding, topline
    independent_expenditures: "2026-11-03"  # all-IE (UDP too)
    freshness_window_start: "2026-10-15"
  # Corporate PAC tolerance presets (methodology §14).
  # Under a preset, a member's corporate PAC take counts as dirty only
  # when BOTH the dollar amount AND the share of 2026 total receipts
  # exceed the preset's thresholds. The AIPAC/UDP flag is NOT
  # tolerance-based: any AIPAC direct dollar or UDP benefit dollar
  # flags the member under every preset. Strict has no thresholds of
  # its own — it is clean_2026 itself (any net dirty dollar > $0 is
  # dirty; net dirty <= $0 is clean). Balanced is the DEFAULT preset.
  # Share denominator note: corp_2026 (pas2) and total_receipts_2026
  # (weball) must run through the same coverage end (coverage_end
  # above), or the share is skewed. A non-positive total_receipts_2026
  # leaves the share undefined and the share test cannot pass.
  tolerance_presets:
    balanced:
      corp_amount: 100000
      corp_share: 0.05
    lenient:
      corp_amount: 250000
      corp_share: 0.10


