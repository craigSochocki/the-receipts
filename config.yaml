  dataset_json: congress-money-tracker.json

# As-of date carried on every dataset row (data_as_of). Update when the
# pulls are re-run on newer filings.
data_as_of: "2026-11-12"

fec_api:
  base_url: "https://api.open.fec.gov/v1/candidates/"
  api_key_env: "FEC_API_KEY"       # set to a real key for production use
  api_key_default: "DEMO_KEY"      # demo key: rate-limited, lookup only
  request_timeout_seconds: 30
  sleep_between_requests_seconds: 0.4
  # HTTP 429 retry (src/common/api_retry.py, used by the api_get helpers
  # in pull_f6 / pull_f24 / pull_freshness and by pull_f6's docquery CSV
  # fetch). A standard registered api.data.gov key allows 1,000
  # requests/hour; a full freshness --all run makes ~2,200-2,350 keyed
  # calls, so it hits 429 part-way through. On a 429 the wait is the
  # Retry-After header when present, else exponential backoff
  # (backoff_base_seconds * 2**(attempt-1), capped at
  # backoff_cap_seconds). max_attempts bounds the retries; if a
  # projected wait would push the total waited for one request past
  # max_wait_seconds, the run fails loudly instead of sleeping it out.
  # Non-429 HTTP errors are NOT retried (immediate SystemExit, as before).
  retry:
    max_attempts: 5                # total attempts per request (1 + 4 retries)
    backoff_base_seconds: 2.0      # first backoff wait; then 4s, 8s, 16s (capped)
    backoff_cap_seconds: 300.0     # longest single backoff wait (5 min)
    max_wait_seconds: 900.0        # longest total wait for one request (15 min)

freshness:
  # F24 committee sweeps (24/48-hour independent expenditures, cycle 2026
  # only): a bare `pull_freshness.py --all` — the form the scheduled
  # refresh runs — sweeps each committee below committee-wide (every
  # candidate it targeted, roster or not) and attributes rows to roster
  # people by candidate_id. The five are the top 5 by 2026
  # roster-targeted IE (data/intermediate/all_ie_per_cycle.json ->
  # per_cycle_summaries.2026.top_committees_roster_targeted, 2026 totals
  # through Oct 31); UDP is #10 by total but included by design:
  # AIPAC-affiliated, and the source of the $20.9M vs El-Sayed F24
  # finding. The dollar figures in the notes are those same 2026
  # roster-targeted totals (S support / O oppose), recorded here for
  # the record — no script reads them.
  f24_committee_sweep_cycle: 2026
  f24_committee_sweep:
    - committee_id: "C00960435"
      committee_name: "NO GOING BACK PAC INC."
      note: "#1 by 2026 roster-targeted IE: $227,177,570.85 (S $24,666,812.45 / O $202,510,758.40)"
    - committee_id: "C00865444"
      committee_name: "WinSenate"
      note: "#2 by 2026 roster-targeted IE: $166,050,827.13 (S $34,946,905.85 / O $131,103,921.28)"
    - committee_id: "C00495028"
      committee_name: "HMP"
      note: "#3 by 2026 roster-targeted IE: $150,884,797.72 (S $4,146,002.09 / O $146,738,795.63)"
    - committee_id: "C00960211"
      committee_name: "TEXAS PAC"
      note: "#4 by 2026 roster-targeted IE: $112,153,741.90 (all oppose)"
    - committee_id: "C00836221"
      committee_name: "DEFEND AMERICAN JOBS"
      note: "#5 by 2026 roster-targeted IE: $90,387,313.50 (S $70,681,048.37 / O $19,706,265.13)"
    - committee_id: "C00799031"
      committee_name: "UNITED DEMOCRACY PROJECT (UDP)"
      note: "#10 by 2026 roster-targeted IE: $43,620,238.47 (S $17,497,693.29 / O $26,122,545.18); included by design (AIPAC-affiliated; source of the $20.9M vs El-Sayed F24 finding)"
  # Pre-flight gate (src/ingest/pull_gate.py): one global /filings/
  # check per family before the per-person legs of `pull_freshness.py
  # --all`. F6 gates the Form 6 leg, F24 gates the six committee
  # sweeps above, F3 gates the candidate-totals leg. F3X is
  # deliberately NOT a family — F3X is filed by non-candidate
  # committees (PACs, parties) and no freshness leg is driven by
  # F3X filings, so gating on it would gate nothing (see
  # pull_gate.py's module docstring). max_pages_per_family bounds
  # the backward scan: hitting it is a gate error, and a gate error
  # falls back to the full run, never to a skip.
  gate:
    families: ["F6", "F24", "F3"]
    per_page: 100
    max_pages_per_family: 200
    committee_master_path: "data/raw/cm/2026/cm.txt"

party_codes:
  # Roster party label -> FEC API party code (used by fec_lookup.py).
  Democrat: DEM
  Republican: REP
  Independent: IND
  PPD: DEM

