# The Receipts — single source of truth for values shared across pipeline scripts.
#
# Rules:
# - Every script loads this file through work/config.py (load_config()).
# - All paths are relative to the repo root (the directory containing this file).
# - Scripts resolve paths from the repo root, never from an absolute path and
#   never from the current working directory.
# - Do not re-hardcode any value from this file in a script. If a new script
#   needs a shared value, add it here first.

committees:
  # FEC committee IDs, verified by direct FEC API lookup (see methodology.md).
  aipac_pac: "C00797670"  # AIPAC PAC
  udp: "C00799031"        # United Democracy Project (AIPAC-affiliated super PAC)

cycles:
  career_start: 1980       # first FEC cycle in the career money pull
  career_end: 2026         # last FEC cycle in the career money pull
  udp: [2022, 2024, 2026]  # cycles with UDP independent-expenditure data (UDP first filed Jan 2022)
  current: 2026            # current / most recent cycle, used for diagnostics and FEC lookups

paths:
  work: work
  bulk: work/bulk
  ie: work/bulk/ie
  roster: work/roster.json
  roster_intermediate: work/roster_intermediate.json
  opposition_computed: work/opposition-computed.json
  dataset_csv: congress-money-tracker.csv
  dataset_json: congress-money-tracker.json

fec_api:
  base_url: "https://api.open.fec.gov/v1/candidates/"
  api_key_env: "FEC_API_KEY"       # set to a real key for production use
  api_key_default: "DEMO_KEY"      # demo key: rate-limited, lookup only
  request_timeout_seconds: 30
  sleep_between_requests_seconds: 0.4

party_codes:
  # Roster party label -> FEC API party code (used by fec_lookup.py).
  Democrat: DEM
  Republican: REP
  Independent: IND
  PPD: DEM

verification:
  # Prior UDP pull's deduped S+O totals per cycle, used to reconcile the
  # opposition-credit computation against the original UDP support pull.
  udp_prior_cycle_totals:
    2022: 26107515.77
    2024: 38044932.69
    2026: 54322881.51
  # Uncredited races are only listed in the opposition report when the
  # opposing spend reaches this threshold (dollars).
  opposition_uncredited_report_threshold: 100000
